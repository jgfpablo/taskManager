<div class="mb-6">
  <button
    (click)="sharedService.open('addTask'); sharedService.setData(project?.id)"
    class="inline-flex items-center px-5 py-2.5 bg-linear-to-r from-purple-600 to-indigo-700 text-white font-semibold rounded-lg shadow hover:brightness-110 transition"
  >
    + Add Task
  </button>
</div>

<div class="overflow-x-auto rounded-xl border border-white/20 bg-white/10 backdrop-blur-md shadow-lg">
  <table class="min-w-full divide-y divide-white/20">
    <thead class="bg-white/10">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Title</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Description</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Status</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Priority</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Actions</th>
      </tr>
    </thead>

    <tbody class="divide-y divide-white/10">
      @for (task of tasks$ | async; track task.id) {
        <tr class="hover:bg-white/10 transition">
          <td class="px-4 py-3 text-gray-200">{{ task.title }}</td>
          <td class="px-4 py-3 font-medium text-white">{{ task.description }}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-1 rounded-full text-xs font-semibold bg-purple-600/40 text-purple-200">
              {{ task.status_name }}
            </span>
          </td>
          <td class="px-4 py-3">
            <span class="px-2 py-1 rounded-full text-xs font-semibold bg-indigo-600/40 text-indigo-200">
              {{ task.priority_name }}
            </span>
          </td>
          <td class="px-4 py-3">
            <button
              (click)="sharedService.setData(task); sharedService.open('deleteTask')"
              class="px-4 py-2 bg-linear-to-r from-red-500 to-red-700 text-white rounded-lg shadow hover:brightness-110 transition"
            >
              Eliminar tarea
            </button>
            <button
              (click)="sharedService.setData(task); sharedService.open('deleteTask')"
              class="px-4 ml-2 py-2 bg-linear-to-r from-orange-500 to-red-700 text-white rounded-lg shadow hover:brightness-110 transition"
            >
              Editar tarea
            </button>
            <button
              (click)="sharedService.setData(task); sharedService.open('deleteTask')"
              class="px-4 ml-2 py-2 bg-linear-to-r from-blue-500 to-purple-700 text-white rounded-lg shadow hover:brightness-110 transition"
            >
              Asignar tarea
            </button>
          </td>
        </tr>
      }

      @empty {
        <tr>
          <td colspan="5" class="px-4 py-6 text-center text-gray-300">
            No hay tareas en este proyecto.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
