 
  <button (click)="sharedService.open('addMember')">add Member</button>
 <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">User ID</th>
          <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Rol</th>
          <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Fecha ingreso</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
       
        @for (member of project?.members ?? []; track member.id) {
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-2 text-gray-700">{{ member.user_id }}</td>
            <td class="px-4 py-2 font-medium text-gray-900">{{ member.role }}</td>
            <td class="px-4 py-2 text-gray-500">{{ member.joined_at | date:'short' }}</td>
            <td><button (click)="sharedService.setData(member);sharedService.open('deleteMember')">quitar miembro</button></td>
          </tr>
        }
        @empty {
          <tr>
            <td colspan="3" class="px-4 py-4 text-center text-gray-500">
              No hay miembros en este proyecto.
            </td>
          </tr>
        }
      </tbody>
    </table>
