<div class="mb-6">
  <button
    (click)="sharedService.open('addMember')"
    class="inline-flex items-center px-5 py-2.5 bg-linear-to-r from-purple-600 to-indigo-700 text-white font-semibold rounded-lg shadow hover:brightness-110 transition"
  >
    + Add Member
  </button>
</div>

<div class="overflow-x-auto rounded-xl border border-white/20 bg-white/10 backdrop-blur-md shadow-lg">
  <table class="min-w-full divide-y divide-white/20">
    <thead class="bg-white/10">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">User ID</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Rol</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Fecha ingreso</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Acciones</th>
      </tr>
    </thead>

    <tbody class="divide-y divide-white/10">
      @for (member of project?.members ?? []; track member.id) {
        <tr class="hover:bg-white/10 transition">
          <td class="px-4 py-3 text-gray-200">{{ member.user_id }}</td>
          <td class="px-4 py-3 font-medium text-white">{{ member.role }}</td>
          <td class="px-4 py-3 text-gray-300">{{ member.joined_at | date:'short' }}</td>
          <td class="px-4 py-3">
            <button
              (click)="sharedService.setData(member); sharedService.open('deleteMember')"
              class="px-4 py-2 bg-linear-to-r from-red-500 to-red-700 text-white rounded-lg shadow hover:brightness-110 transition"
            >
              Quitar miembro
            </button>
          </td>
        </tr>
      }

      @empty {
        <tr>
          <td colspan="4" class="px-4 py-6 text-center text-gray-300">
            No hay miembros en este proyecto.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
