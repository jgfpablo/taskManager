<div class="w-full flex flex-col justify-center items-start p-8 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl">
  <h2 class="text-2xl font-bold mb-6 text-white">Mis proyectos</h2>

<div class="mb-6">
  <button
    [routerLink]="['/projects/new']"
    class="inline-flex items-center px-5 py-2.5 bg-linear-to-r from-purple-600 to-indigo-700 text-white font-semibold rounded-lg shadow hover:brightness-110 transition"
  >
    Crear proyecto
  </button>
</div>

<div class="overflow-x-auto rounded-xl border border-white/20 bg-white/10 backdrop-blur-md shadow-lg">
  <table class="min-w-full divide-y divide-white/20">
    <thead class="bg-white/10">
      <tr>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Nombre</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Descripción</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Creado</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Autor</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">ID</th>
        <th class="px-4 py-3 text-left text-xs font-semibold text-gray-200 uppercase tracking-wider">Acciones</th>
      </tr>
    </thead>

    <tbody class="divide-y divide-white/10">
      @for (project of projects(); track project.id) {
        <tr class="hover:bg-white/10 transition">
          <td class="px-4 py-3 font-medium text-white">{{ project.name }}</td>
          <td class="px-4 py-3 text-gray-200">{{ project.description }}</td>
          <td class="px-4 py-3 text-gray-300">{{ project.created_at | date: 'medium' }}</td>
          <td class="px-4 py-3 text-gray-300">{{ project.created_by }}</td>
          <td class="px-4 py-3 text-gray-400 text-xs">{{ project.id }}</td>
          <td class="px-4 py-3">
            <button
              (click)="showProject(project.id)"
              class="inline-flex items-center px-4 py-2 bg-linear-to-r from-purple-600 to-indigo-700 text-white rounded-lg shadow hover:brightness-110 transition"
            >
              Show Project
            </button>
          </td>
        </tr>
      }

      @empty {
        <tr>
          <td colspan="6" class="px-4 py-6 text-center text-gray-300">
            No hay proyectos aún.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
</div>
