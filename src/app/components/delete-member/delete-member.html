<div>

 <h2>¿Está seguro de eliminar este miembro?</h2>

    <p>Role: {{projectData()?.role }}</p>
    <p>Email: {{userData()?.email }}</p>
    <p>Name: {{userData()?.name }}</p>


    <div class="flex justify-end space-x-3 mt-4">
      <button (click)="onCancel()" type="button" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
      <button (click)="onDelete()" type="submit" class="px-4 py-2 bg-red-600 text-white rounded">Eliminar</button>
</div>
