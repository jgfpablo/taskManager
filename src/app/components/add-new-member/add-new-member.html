  <div>
    <h2 class="text-xl font-semibold">Add new Member</h2>
  </div>

  <!-- Body -->
  <div >
    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Correo electrónico</label>
      <input [(ngModel)]="email" type="email"
            class="w-full border rounded p-2"
            placeholder="ejemplo@correo.com" />
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2">Rol</label>
      <select [(ngModel)]="role" class="w-full border rounded p-2">
        <option value="" disabled selected>-- Selecciona un rol --</option>
        @for (item of roles; track item) {
        <option [value]="item">{{ item }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Footer -->
  <div class="flex justify-end space-x-3">
    <button (click)="onCancel()" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
    <button (click)="onSave()" class="px-4 py-2 bg-green-600 text-white rounded">Agregar</button>
  </div>
