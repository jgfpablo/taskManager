<div class="p-6 bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl max-w-lg mx-auto">
  <!-- Header -->
  <h2 class="text-2xl font-bold mb-6 text-white">Add new Task</h2>

  <!-- Body -->
  <form [formGroup]="newTask">
    <!-- Title -->
    <div class="mb-4">
      <label class="block text-gray-200 mb-2">Título de la tarea</label>
      <input
        formControlName="title"
        type="text"
        class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
        placeholder="Título de la tarea"
      />
    </div>

    <!-- Description -->
    <div class="mb-4">
      <label class="block text-gray-200 mb-2">Descripción</label>
      <textarea
        formControlName="description"
        rows="3"
        class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
        placeholder="Descripción de la tarea"
      ></textarea>
    </div>

    <!-- Status -->
    <div class="mb-4">
      <label class="block text-gray-200 mb-2">Status</label>
      <select
        formControlName="status"
        class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
      >
        <option value="" disabled selected>Seleccione el estado</option>
        @for (s of status; track s.id) {
          <option [value]="s.id" class="text-black">{{ s.name }}</option>
        }
      </select>
    </div>

    <!-- Priority -->
    <div class="mb-4">
      <label class="block text-gray-200 mb-2">Priority</label>
      <select
        formControlName="priority"
        class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
      >
        <option value="" disabled selected>Seleccione una prioridad</option>
        @for (p of priority; track p.id) {
          <option [value]="p.id" class="text-black">{{ p.name }}</option>
        }
      </select>
    </div>

    <!-- Due Date -->
    <div class="mb-4">
      <label class="block text-gray-200 mb-2">Fecha límite</label>
      <input
        type="date"
        formControlName="dueDate"
        class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white focus:outline-none focus:ring-2 focus:ring-purple-500"
      />
    </div>

    <!-- Footer -->
    <div class="flex justify-end space-x-3 mt-6">
      <button
        (click)="onCancel()"
        type="button"
        class="px-4 py-2 bg-white/10 border border-white/20 text-gray-200 rounded-lg hover:bg-white/20 transition"
      >
        Cancelar
      </button>
      <button
        (click)="onSave()"
        type="submit"
        class="px-4 py-2 bg-linear-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-lg shadow hover:brightness-110 transition"
      >
        Agregar
      </button>
    </div>
  </form>
</div>
