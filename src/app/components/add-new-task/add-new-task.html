  <div>
    <h2 class="text-xl font-semibold">Add new Task</h2>
  </div>

  <!-- Body -->
  <form [formGroup]="newTask">
    <div>
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Título de la tarea</label>
        <input formControlName="title" type="text"
              class="w-full border rounded p-2"
              placeholder="Título de la tarea" />
      </div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Descripción</label>
        <textarea formControlName="description"
                  class="w-full border rounded p-2"
                  placeholder="Descripción de la tarea"></textarea>
      </div>

       <div class="mb-4">
  <label class="block text-gray-700 mb-2">Status</label>
  <select formControlName="status"
          class="w-full border rounded p-2">
    <option value="">Seleccione el estado</option>
    @for (s of status; track s.id) {
    <option [value]="s.id">{{ s.name }}</option>
  }

  </select>
</div>

    <div class="mb-4">
  <label class="block text-gray-700 mb-2">Priority</label>
  <select formControlName="priority"
          class="w-full border rounded p-2">
    <option value="">Seleccione una prioridad</option>
    @for(p of priority; track p.id){ 
      <option [value]="p.id">{{p.name}}</option>
    }
  </select>
</div>

      <div class="mb-4">
        <label class="block text-gray-700 mb-2">dueDate</label>
        <input type="date" formControlName="dueDate" 
              class="w-full border rounded p-2" />
    </div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end space-x-3">
      <button (click)="onCancel()" type="button" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
      <button (click)="onSave()" type="submit" class="px-4 py-2 bg-green-600 text-white rounded">Agregar</button>
    </div>

  </form>
