<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm bg-white/10 backdrop-blur-lg rounded-xl shadow-xl p-8 border border-white/20">
    <h2 class="text-3xl font-extrabold text-center mb-8 text-white tracking-wide">
      Iniciar Sesión
    </h2>

    <form [formGroup]="registerForm" (ngSubmit)="register()" class="space-y-6">

      <!-- Usuario -->
      <div>
        <label class="block text-sm font-medium text-white mb-2">Nombre Usuario</label>
        <input
          type="text"
          formControlName="name"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-400"
          placeholder="Sebastian"
        />
        <div class="text-red-400 text-xs mt-1">
          Ingresá un usuario válido
        </div>
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-white mb-2">Correo electrónico</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-400"
          placeholder="ejemplo@correo.com"
        />
        <div class="text-red-400 text-xs mt-1">
          Ingresá un correo válido
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-white mb-2">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 rounded-lg bg-white/20 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-pink-400"
          placeholder="********"
        />
        <div class="text-red-400 text-xs mt-1">
          La contraseña es obligatoria
        </div>
      </div>

      <!-- Botón -->
      <button
        type="submit"
        class="w-full bg-linear-to-r from-pink-500 to-purple-600 text-white py-2 rounded-lg font-semibold shadow-lg hover:from-pink-600 hover:to-purple-700 transition-all"
      >
        Entrar
      </button>
    </form>
  </div>
</div>
