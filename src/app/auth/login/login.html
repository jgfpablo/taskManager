<div class="flex items-center justify-center min-h-screen min-w-screen overflow-hidden">
  <!-- halos decorativos -->
  <div class="absolute top-0 right-0 w-125 h-125 bg-purple-700 opacity-30 rounded-full blur-3xl"></div>
  <div class="absolute bottom-0 left-0 w-100 h-100 bg-indigo-900 opacity-30 rounded-full blur-3xl"></div>

  <!-- Card glass -->
  <div class="w-full max-w-sm bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl shadow-xl p-8 relative z-10">
    <h2 class="text-2xl font-bold text-center mb-6 text-white">Iniciar Sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <!-- Email -->
      <div class="mb-4">
        <label class="block text-gray-200 mb-2">Correo electrónico</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
          placeholder="ejemplo@correo.com"
        />
        <!-- Validación -->
         @if(loginForm.get('email')?.invalid && loginForm.get('email')?.touched){
        <div 
             class="text-red-400 text-sm mt-1">
          Ingresá un correo válido
        </div>
        }
      </div>

      <!-- Password -->
      <div class="mb-4">
        <label class="block text-gray-200 mb-2">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-3 py-2 border border-white/20 rounded-lg bg-white/5 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500"
          placeholder="********"
        />
        <!-- Validación -->
         @if(loginForm.get('password')?.invalid && loginForm.get('password')?.touched){
        <div
             class="text-red-400 text-sm mt-1">
          La contraseña es obligatoria
        </div>
      }
      </div>

      <!-- Botón -->
      <button
        type="submit"
        class="w-full bg-linear-to-br from-purple-500 to-indigo-700 text-white py-2 rounded-lg font-semibold shadow hover:brightness-110 transition"
      >
        Entrar
      </button>
    </form>
  </div>
</div>
